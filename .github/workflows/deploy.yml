# Deploy the CaLoMei Clone PWA to GitHub Pages.
# Push to main -> build -> deploy. No secrets needed: the workflow uses the
# built-in GITHUB_TOKEN via the official Pages actions.
#
# 2026-11-25: upgraded the three Pages actions (configure-pages v5->v6,
# upload-pages-artifact v3->v5, deploy-pages v4->v5). The old pairing failed
# three runs in a row at the Deploy step with "No artifacts named
# 'github-pages' were found" even though Upload reported success — the
# v3 uploader + v4 deployer against the current artifact backend. v5 also
# moves off Node 20 (the deprecation warning in the logs). dist has no
# dotfiles, so the v4 hidden-files change does not affect us.
#
# One-time repo setup (owner):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
